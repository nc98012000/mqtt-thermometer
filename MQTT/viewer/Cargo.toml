[package]
name = "mqtt-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
# 關掉預設的 TLS（rustls），公開 broker 用 1883 明文即可，編譯也較快
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
